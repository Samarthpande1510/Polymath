[project]
name = "polymath-cli"
version = "0.2.7"
description = "Ask anything about any codebase. Local, private, fast."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Samarth Pande", email = "your-email@gmail.com"}
]
keywords = ["cli", "codebase", "ai", "rag", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "alembic>=1.18.4",
    "gitpython>=3.1.50",
    "pathspec>=1.1.1",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.50",
    "typer>=0.26.7",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "fastembed>=0.8.0",
    "openai>=2.41.1",
    "pyperclip>=1.8.2",
]

[project.urls]
Homepage = "https://github.com/Samarthpande1510/Polymath"
Repository = "https://github.com/Samarthpande1510/Polymath"

[project.scripts]
pm = "pm.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pm*", "alembic*"]

[tool.setuptools.package-data]
"*" = ["*.ini", "*.mako"]


[dependency-groups]
dev = [
    "build>=1.5.0",
    "pyinstaller>=6.20.0",
    "twine>=6.2.0",
]
